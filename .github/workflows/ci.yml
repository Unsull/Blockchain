name: CI

on:
  push:
    branches: ["main", "feature/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Report Solidity build environment
        run: |
          forge --version
          python3 --version
          git --version
          solc --version || true
          git ls-files --eol \
            contracts/EvidenceRegistryV3.sol \
            artifacts/EvidenceRegistryV3.json \
            scripts/export_artifact.py
      - run: forge fmt --check
      - run: forge build
      - name: Verify committed runtime artifact
        id: artifact-verification
        run: |
          python3 scripts/export_artifact.py --output /tmp/EvidenceRegistryV3.json

          echo "=== Artifact SHA-256 ==="
          sha256sum artifacts/EvidenceRegistryV3.json
          sha256sum /tmp/EvidenceRegistryV3.json

          echo "=== Artifact file size ==="
          wc -c artifacts/EvidenceRegistryV3.json
          wc -c /tmp/EvidenceRegistryV3.json

          echo "=== Structured artifact comparison ==="
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          tracked = json.loads(Path("artifacts/EvidenceRegistryV3.json").read_text())
          generated = json.loads(Path("/tmp/EvidenceRegistryV3.json").read_text())


          def summary(value):
              if isinstance(value, str):
                  encoded = value.encode()
              else:
                  encoded = json.dumps(
                      value,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode()
              return len(encoded), hashlib.sha256(encoded).hexdigest()


          print(f"top-level keys same: {set(tracked) == set(generated)}")
          print(f"tracked-only keys: {sorted(set(tracked) - set(generated))}")
          print(f"generated-only keys: {sorted(set(generated) - set(tracked))}")
          for field in ("contractName", "abi", "bytecode", "deployedBytecode"):
              tracked_value = tracked.get(field)
              generated_value = generated.get(field)
              print(f"{field} same: {tracked_value == generated_value}")
              tracked_length, tracked_hash = summary(tracked_value)
              generated_length, generated_hash = summary(generated_value)
              print(f"{field} tracked length={tracked_length} sha256={tracked_hash}")
              print(f"{field} generated length={generated_length} sha256={generated_hash}")

              if field in ("bytecode", "deployedBytecode"):
                  for child in ("object", "sourceMap", "linkReferences"):
                      tracked_child = (tracked_value or {}).get(child)
                      generated_child = (generated_value or {}).get(child)
                      tracked_length, tracked_hash = summary(tracked_child)
                      generated_length, generated_hash = summary(generated_child)
                      print(f"{field}.{child} same: {tracked_child == generated_child}")
                      print(
                          f"{field}.{child} tracked length={tracked_length} "
                          f"sha256={tracked_hash}"
                      )
                      print(
                          f"{field}.{child} generated length={generated_length} "
                          f"sha256={generated_hash}"
                      )
          PY

          echo "=== Limited artifact diff ==="
          diff -u \
            artifacts/EvidenceRegistryV3.json \
            /tmp/EvidenceRegistryV3.json \
            | head -200 || true

          cmp artifacts/EvidenceRegistryV3.json /tmp/EvidenceRegistryV3.json
      - name: Upload Solidity artifact diagnostics
        if: ${{ failure() && steps.artifact-verification.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: EvidenceRegistryV3-ci-generated-${{ github.sha }}
          path: |
            /tmp/EvidenceRegistryV3.json
            out/EvidenceRegistryV3.sol/EvidenceRegistryV3.json
          if-no-files-found: warn
      - run: forge test -vvv
      - run: forge test --gas-report

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy blockchain_client
      - run: pytest -m "not integration" -vv

  besu-network:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Validate Besu version pin
        run: |
          test "$(grep '^BESU_VERSION=' network/besu/.env.example | cut -d= -f2)" != ""
          ! grep -R "hyperledger/besu:latest" network/besu
      - name: Check script syntax
        run: |
          bash -n network/besu/scripts/generate-network.sh
          bash -n network/besu/scripts/start-network.sh
          bash -n network/besu/scripts/stop-network.sh
          bash -n network/besu/scripts/reset-network.sh
          bash -n network/besu/scripts/deploy-registry.sh
          python -m py_compile network/besu/scripts/*.py
      - name: Check shell script permissions
        run: |
          failed=0
          while IFS= read -r script; do
            entry="$(git ls-files --stage -- "$script")"
            mode="${entry%% *}"
            if [ "$mode" != "100755" ]; then
              echo "::error file=${script}::expected Git mode 100755, got ${mode:-untracked}"
              failed=1
            fi
          done < <(git ls-files 'network/besu/scripts/*.sh')
          exit "$failed"
      - name: Configure Besu runtime identity
        run: |
          echo "BESU_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "BESU_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Docker compose config
        run: docker compose --project-directory network/besu --env-file network/besu/.env.example config
      - name: Generate CI accounts
        run: |
          python - <<'PY'
          from pathlib import Path

          from eth_account import Account

          labels = {
              "DEPLOYER": Account.create(),
              "ADMIN": Account.create(),
              "WRITER": Account.create(),
              "PAUSER": Account.create(),
              "UNAUTHORIZED": Account.create(),
          }
          lines = []
          for label, account in labels.items():
              private_key = account.key.hex().removeprefix("0x")
              lines.append(f"{label}_PRIVATE_KEY=0x{private_key}")
              lines.append(f"{label}_ADDRESS={account.address}")
          output = Path("/tmp/besu-ci-env")
          output.write_text("\n".join(lines) + "\n", encoding="ascii")
          output.chmod(0o600)
          PY
      - name: Generate network
        run: |
          set -a
          source network/besu/.env.example
          set +a
          bash network/besu/scripts/generate-network.sh --force
      - name: Fund ephemeral CI accounts
        run: |
          set -a
          source /tmp/besu-ci-env
          set +a
          python network/besu/scripts/fund-genesis.py \
            --genesis network/besu/genesis/genesis.json \
            --address "${DEPLOYER_ADDRESS}" \
            --address "${ADMIN_ADDRESS}" \
            --address "${WRITER_ADDRESS}" \
            --address "${PAUSER_ADDRESS}" \
            --address "${UNAUTHORIZED_ADDRESS}"
          python network/besu/scripts/validate-generated-network.py \
            --root network/besu \
            --expected-validators 4
      - name: Start network
        run: |
          set -a
          source network/besu/.env.example
          set +a
          bash network/besu/scripts/start-network.sh
      - name: Deploy EvidenceRegistry
        run: |
          set -a
          source network/besu/.env.example
          source /tmp/besu-ci-env
          set +a
          export RPC_URL="http://127.0.0.1:${RPC_HTTP_PORT}"
          export REGISTRY_ADMIN_ADDRESS="${ADMIN_ADDRESS}"
          export WRITER_ADDRESS="${WRITER_ADDRESS}"
          export PAUSER_ADDRESS="${PAUSER_ADDRESS}"
          export ADMIN_PRIVATE_KEY="${ADMIN_PRIVATE_KEY}"
          export DEPLOYER_PRIVATE_KEY="${DEPLOYER_PRIVATE_KEY}"
          bash network/besu/scripts/deploy-registry.sh
      - name: Smoke test
        run: |
          set -a
          source network/besu/.env.example
          source /tmp/besu-ci-env
          source "network/besu/deployments/${CHAIN_ID}/contract-address.env"
          set +a
          export RPC_URL="http://127.0.0.1:${RPC_HTTP_PORT}"
          export WRITER_PRIVATE_KEY="${WRITER_PRIVATE_KEY}"
          export MIN_CONFIRMATIONS=1
          python network/besu/scripts/smoke-test.py
      - name: Failure test subset
        run: |
          set -a
          source network/besu/.env.example
          set +a
          python network/besu/scripts/failure-test.py \
            --rpc-url "http://127.0.0.1:${RPC_HTTP_PORT}" \
            --progress-timeout-seconds 90 \
            --recovery-timeout-seconds 180 \
            --halt-settle-seconds 10 \
            --halt-observation-seconds 20 \
            --poll-interval-seconds 2
      - name: Secret leakage guard
        run: |
          ! grep -R -E 'PRIVATE_KEY=.*0x[0-9a-fA-F]{64}|0xac0974|59c699' network/besu
      - name: Collect Besu diagnostics on failure
        if: failure()
        run: |
          mkdir -p network/besu/logs
          docker compose --project-directory network/besu ps --all \
            > network/besu/logs/compose-ps.txt
          docker compose --project-directory network/besu logs --no-color \
            > network/besu/logs/compose.log
          if [ -f network/besu/build/static-nodes.json ]; then
            cp network/besu/build/static-nodes.json network/besu/logs/static-nodes.json
          fi
      - name: Stop network
        if: always()
        run: docker compose --project-directory network/besu down -v
      - name: Upload Besu diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: besu-network-debug
          path: network/besu/logs
      - name: Remove ephemeral CI secrets
        if: always()
        run: rm -f /tmp/besu-ci-env
