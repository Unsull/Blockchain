global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: besu
    metrics_path: /metrics
    static_configs:
      - targets:
          - validator-1:9545
          - validator-2:9545
          - validator-3:9545
          - validator-4:9545
          - rpc-node:9545
