groups:
  - name: besu-private-network
    rules:
      - alert: BesuRpcNodeDown
        expr: up{job="besu",instance="rpc-node:9545"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Besu RPC node metrics target is down

      - alert: BesuNodeDown
        expr: up{job="besu"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Besu node metrics target is down

      - alert: BesuJvmMemoryHigh
        expr: process_resident_memory_bytes{job="besu"} > 1500000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Besu JVM resident memory is high

      - alert: BesuNoRecentMetrics
        expr: absent(up{job="besu"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: No Besu metrics are being scraped
