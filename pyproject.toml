[project]
name = "evidence-blockchain-client"
version = "0.1.0"
description = "Blockchain module client for EvidenceRegistry private EVM deployments"
requires-python = ">=3.11,<3.13"
dependencies = [
  "web3==6.20.4",
  "eth-account==0.11.3",
  "eth-utils==4.1.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "ruff>=0.5.0,<0.7.0",
  "mypy>=1.10.0,<2.0.0"
]

[tool.setuptools.packages.find]
include = ["blockchain_client*"]
exclude = ["contracts*", "script*", "test*", "tests*", "network*", "examples*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN401"]

[tool.mypy]
python_version = "3.11"
packages = ["blockchain_client"]
ignore_missing_imports = true
strict = true
